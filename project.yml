name: GolfYardageCheatsheet

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  GolfYardageCheatsheet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Sources/GolfYardageCheatsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cepedarod.GolfYardageCheatsheet
        PRODUCT_MODULE_NAME: GolfYardageCheatsheet
        PRODUCT_NAME: Caddie Cat
        DEVELOPMENT_TEAM: 6G3D6K987W
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Caddie Cat
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GolfYardageCheatsheetUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: GolfYardageCheatsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cepedarod.GolfYardageCheatsheetUITests
        PRODUCT_NAME: GolfYardageCheatsheetUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GolfYardageCheatsheet

schemes:
  GolfYardageCheatsheet:
    build:
      targets:
        GolfYardageCheatsheet: all
        GolfYardageCheatsheetUITests:
          - test
    test:
      targets:
        - GolfYardageCheatsheetUITests
